services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    container_name: api-gateway
    env_file:
      - .env
    environment:
      NODE_ENV: dev
      DB_URL: postgres://postgres:pass123@db:5432/mydb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in .env}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3000/api/v1/auth/github/callback}
      GITHUB_SUCCESS_REDIRECT_URL: ${GITHUB_SUCCESS_REDIRECT_URL:-http://localhost:3000/dashboard}
      GITHUB_FAILURE_REDIRECT_URL: ${GITHUB_FAILURE_REDIRECT_URL:-http://localhost:3000/login}
    ports:
      - '3500:3500'
    depends_on:
      - redis
      - db
    networks:
      - cloudterm-network

  redis:
    image: redis/redis-stack
    container_name: redis-stack-container
    ports:
      - '8001:8001'
      - '6379:6379'
    networks:
      - cloudterm-network

  db:
    image: postgres
    container_name: cloudterm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: mydb
    ports:
      - '5431:5432'
    networks:
      - cloudterm-network

networks:
  cloudterm-network:
    driver: bridge
  kind:
    external: true
