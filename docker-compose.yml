services:
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    container_name: api-gateway
    env_file:
      - .env
    environment:
      DB_URL: postgres://postgres:pass123@db:5432/mydb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GITHUB_CLIENT_ID: Ov23livnOkCQhaa7t3sZ
      GITHUB_CLIENT_SECRET: eef958a29452ef385b814e993357a9dcbf3a477f
      GITHUB_CALLBACK_URL: http://localhost:3500/api/v1/auth/github/callback
    ports:
      - '3500:3500'
    depends_on:
      - redis
      - db
    networks:
      - cloudterm-network

  redis:
    image: redis/redis-stack
    container_name: redis-stack-container
    ports:
      - '8001:8001'
      - '6379:6379'
    networks:
      - cloudterm-network

  db:
    image: postgres
    container_name: cloudterm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: mydb
    ports:
      - '5431:5432'
    networks:
      - cloudterm-network

networks:
  cloudterm-network:
    driver: bridge
  kind:
    external: true
